version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splitsmart
      POSTGRES_PASSWORD: splitsmart_pw
      POSTGRES_DB: splitsmart
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "8085:5000"
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: splitsmart
      DB_PASSWORD: splitsmart_pw
      DB_NAME: splitsmart
      JWT_SECRET: dev_jwt_secret_change_later
      GOOGLE_CLIENT_ID: dummy_client_id
      GOOGLE_CLIENT_SECRET: dummy_client_secret
      GOOGLE_CALLBACK_URL: http://localhost:8085/auth/google/callback
      GROQ_API_KEY: dummy_key
      CLIENT_URL: http://localhost:3000
    depends_on:
      - postgres

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pgdata:
